<div class="form-card">
	<h3>{{ isEdit ? 'Edit Unit' : 'Create Unit' }}</h3>

	<div class="form-grid">
		<div class="form-group">
			<label>Vehicle Model</label>
			<select [(ngModel)]="formVehicleId">
				<option [ngValue]="undefined">-- Select Vehicle --</option>
				<option *ngFor="let v of vehicles" [ngValue]="v.id">{{ v | vehicleDesc }}</option>
			</select>
		</div>

		<div class="form-group">
			<label>Licence Plate</label>
			<input [(ngModel)]="formLicence" placeholder="e.g. 123ABC" />
		</div>

		<div class="form-group">
			<label>VIN (Vehicle Identification Number)</label>
			<input [(ngModel)]="formVin" placeholder="17-digit code" />
		</div>

		<div class="form-group">
			<label>Price Per Day ($)</label>
			<input type="number" [(ngModel)]="formPrice" placeholder="0.00" />
		</div>

		<div class="form-group checkbox-group">
			<label>
				<input type="checkbox" [(ngModel)]="formBookable" />
				Available for Booking
			</label>
		</div>
	</div>

	<div class="form-actions">
		<button (click)="cancel()">Cancel</button>
		<button class="btn-primary" (click)="save()">
			{{ isEdit ? 'Save Changes' : 'Create Unit' }}
		</button>
	</div>
</div>
