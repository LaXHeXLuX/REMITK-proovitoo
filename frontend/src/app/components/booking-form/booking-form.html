<div class="form-card">
	<h3>{{ isEdit ? 'Edit Booking' : 'Create New Booking' }}</h3>

	<div class="form-grid">
		<div class="form-group">
			<label>Assigned Vehicle Unit</label>
			<select [(ngModel)]="formUnitId">
				<option [ngValue]="undefined">-- Select Available Unit --</option>
				<option *ngFor="let u of availableUnits" [ngValue]="u.id">
					{{ u.vehicle.name }} ({{ u.licencePlate || '-' }})
				</option>
			</select>
		</div>

		<div class="form-group">
			<label>Client Full Name</label>
			<input [(ngModel)]="formClientName" placeholder="e.g. John Doe" />
		</div>

		<label class="date-picker-label">
			<span>Start:</span>
			<app-date-time-picker 
				[(dateValue)]="formBookingDateStart" 
				[(timeValue)]="formBookingTimeStart"
				(dateTimeChange)="onDateChange()">
			</app-date-time-picker>
		</label>

		<label class="date-picker-label">
			<span>End:</span>
			<app-date-time-picker 
				[(dateValue)]="formBookingDateEnd" 
				[(timeValue)]="formBookingTimeEnd"
				[minAfter]="formBookingDateStart + ' ' + formBookingTimeStart"
				(dateTimeChange)="onDateChange()">
			</app-date-time-picker>
		</label>
	</div>

	<div class="form-actions">
		<button (click)="cancel()">Cancel</button>
		<button class="btn-primary" (click)="save()">
			{{ isEdit ? 'Confirm Booking' : 'Create Booking' }}
		</button>
	</div>
</div>
