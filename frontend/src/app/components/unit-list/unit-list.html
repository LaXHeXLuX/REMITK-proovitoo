<div class="page-container">
	<div class="toolbar">
		<label><input class="search-input" type="text" [(ngModel)]="searchText" placeholder="Search"></label>
		<label><input type="checkbox" (change)="showOnlyBookable = $any($event.target).checked" /> Show only
			bookable</label>
		<button (click)="openCreate()">Add Unit</button>
	</div>

	<div *ngIf="showForm">
		<app-unit-form [unit]="selectedUnit" (saved)="onSaved($event)" (closed)="onClosed()"></app-unit-form>
	</div>

	<table class="data-table">
		<thead>
			<tr>
				<th>Vehicle</th>
				<th>VIN</th>
				<th>Licence</th>
				<th>Price / day</th>
				<th>Bookable</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let u of filtered">
				<td>{{ u.vehicle.name || '—' }}</td>
				<td>{{ u['vin'] || '—' }}</td>
				<td>{{ u.licencePlate || '—' }}</td>
				<td>{{ u.pricePerDay ?? '—' }}</td>
				<td>{{ u.bookable }}</td>
				<td>
					<button class="btn-icon" (click)="openEdit(u)">Edit</button>
					<button class="btn-icon btn-danger" (click)="deleteUnit(u.id)">Delete</button>
				</td>
			</tr>
		</tbody>
	</table>
</div>
