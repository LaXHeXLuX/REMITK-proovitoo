<div class="booking-list">
  <table class="bookings">
    <thead>
      <tr>
        <th>Client</th>
        <th>Vehicle</th>
        <th>Unit</th>
        <th>Start</th>
        <th>End</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of bookings">
        <td>{{ b.clientName }}</td>
        <td>{{ b.unit.vehicle.name || '—' }}</td>
        <td>{{ b.unit.licencePlate || '—' }}</td>
        <td>{{ b.bookingStart }}</td>
        <td>{{ b.bookingEnd }}</td>
        <td><button (click)="deleteBooking(b.id)">Delete</button></td>
      </tr>
    </tbody>
  </table>
</div>
