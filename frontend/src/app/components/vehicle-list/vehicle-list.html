<div class="vehicle-list">
	<div class="toolbar">
    <label>
      <input (input)="searchTerm = $any($event.target).value" placeholder="Search by name, company or year" />
    </label>
		<button (click)="openCreate()">Add Vehicle</button>
  </div>

	<div *ngIf="showForm">
		<app-vehicle-form [vehicle]="selectedVehicle" (saved)="onSaved($event)" (closed)="onClosed()"></app-vehicle-form>
	</div>

	<table class="vehicles">
		<thead>
			<tr>
				<th>Name</th>
				<th>Company</th>
				<th>Seats</th>
				<th>Fuel</th>
				<th>Transmission</th>
				<th>Year</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let v of filteredVehicles">
				<td>{{ v.name }}</td>
				<td>{{ v.company }}</td>
				<td>{{ v.numberOfSeats }}</td>
				<td>{{ v.fuel }}</td>
				<td>{{ v.transmission }}</td>
				<td>{{ v.year }}</td>
				<td>
					<button (click)="openEdit(v)">Edit</button>
					<button (click)="deleteVehicle(v.id)">Delete</button>
				</td>
			</tr>
		</tbody>
	</table>
</div>
