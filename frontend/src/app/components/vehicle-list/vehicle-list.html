<div class="page-container">
	<div class="toolbar">
		<label><input class="search-input" type="text" [(ngModel)]="searchText" placeholder="Search"></label>
		<button (click)="openCreate()">Add Vehicle</button>
	</div>

	<div *ngIf="showForm">
		<app-vehicle-form [vehicle]="selectedVehicle" (saved)="onSaved($event)" (closed)="onClosed()">
		</app-vehicle-form>
	</div>

	<table class="data-table">
		<thead>
			<tr>
				<th>Name</th>
				<th>Company</th>
				<th>Seats</th>
				<th>Fuel</th>
				<th>Transmission</th>
				<th>Year</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let v of filtered">
				<td><strong>{{ v.name }}</strong></td>
				<td>{{ v.company }}</td>
				<td>{{ v.numberOfSeats }}</td>
				<td>{{ v.fuel }}</td>
				<td>{{ v.transmission }}</td>
				<td>{{ v.year }}</td>
				<td>
					<button class="btn-icon" (click)="openEdit(v)">Edit</button>
					<button class="btn-icon btn-danger" (click)="deleteVehicle(v.id)">Delete</button>
				</td>
			</tr>
		</tbody>
	</table>
</div>
