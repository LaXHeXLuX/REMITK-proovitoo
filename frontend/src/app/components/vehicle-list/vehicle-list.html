<div class="vehicle-list">
	<div class="toolbar">
    <label>
      <input (input)="searchTerm = $any($event.target).value" placeholder="Search by name, company or year" />
    </label>
  </div>

	<div class="form">
		<h3>{{ editing ? 'Edit Vehicle' : 'Add Vehicle' }}</h3>
    <div *ngIf="formError" style="color:#b91c1c; margin-bottom:8px">{{ formError }}</div>
		<div class="row"><label>
      <input placeholder="Name" [value]="formName" (input)="formName = $any($event.target).value" />
    </label></div>
		<div class="row"><label>
      <input placeholder="Company" [value]="formCompany" (input)="formCompany = $any($event.target).value" />
    </label></div>
		<div class="row"><label>
      <input type="number" placeholder="Seats" [value]="formSeats" (input)="formSeats = $any($event.target).value ? +$any($event.target).value : null" />
    </label></div>
		<div class="row">
      <label>
        <select [value]="formFuel" (change)="formFuel = $any($event.target).value">
          <option value="diesel">diesel</option>
          <option value="gasoline">gasoline</option>
          <option value="electric">electric</option>
          <option value="LPG">LPG</option>
        </select>
      </label>
      <label>
        <select [value]="formTransmission" (change)="formTransmission = $any($event.target).value">
          <option value="manual">manual</option>
          <option value="automatic">automatic</option>
        </select>
      </label>
      <label>
        <input type="number" placeholder="Year" [value]="formYear" (input)="formYear = $any($event.target).value ? +$any($event.target).value : null" />
      </label>
    </div>
		<div class="actions">
			<button (click)="saveVehicle()">{{ editing ? 'Save' : 'Create' }}</button>
			<button *ngIf="editing" (click)="cancelEdit()">Cancel</button>
			<button *ngIf="!editing" (click)="startCreate()">Clear</button>
		</div>
	</div>

	<table class="vehicles">
		<thead>
			<tr>
				<th>Name</th>
				<th>Company</th>
				<th>Seats</th>
				<th>Fuel</th>
				<th>Transmission</th>
				<th>Year</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let v of filteredVehicles">
				<td>{{ v.name }}</td>
				<td>{{ v.company }}</td>
				<td>{{ v.numberOfSeats }}</td>
				<td>{{ v.fuel }}</td>
				<td>{{ v.transmission }}</td>
				<td>{{ v.year }}</td>
				<td>
					<button (click)="deleteVehicle(v.id)">Delete</button>
				</td>
			</tr>
		</tbody>
	</table>
</div>
